services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: restful-reads-api
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/bookstore
      - JWT_SECRET=mysecret
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restful-reads-tests
    environment:
      - ENV=uat
      - THREAD_COUNT=5
      - GROUPS=smoke
      - BASE_URL=http://api:5000
    depends_on:
      api:
        condition: service_started

volumes:
  mongo-data: